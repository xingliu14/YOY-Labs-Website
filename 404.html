<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOY Labs — 404</title>
<meta name="robots" content="noindex">
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#05070f; color:#e8eef8; font-family:"JetBrains Mono","SF Mono",ui-monospace,monospace; text-align:center; }
  .box { padding:32px; }
  .code { font-size:clamp(4rem,14vw,8rem); font-weight:700; line-height:1; letter-spacing:-.04em;
    background:linear-gradient(100deg,#22d3ee,#5eead4 35%,#a78bfa 70%,#e879f9); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:#8b98b8; margin:18px 0 28px; }
  a { color:#5eead4; text-decoration:none; border:1px solid rgba(94,234,212,.35); padding:12px 22px; border-radius:10px; }
  a:hover { background:rgba(94,234,212,.08); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <p>&gt; route not found. redirecting to base<span id="dots">...</span></p>
    <a id="home" href="/">Return to YOY Labs</a>
  </div>
  <script>
    // Works for both project pages (/YOY-Labs-Website/) and a custom domain (/).
    const base = location.hostname.endsWith("github.io") ? "/" + location.pathname.split("/")[1] + "/" : "/";
    document.getElementById("home").href = base;
    setTimeout(() => location.replace(base), 2500);
  </script>
</body>
</html>
